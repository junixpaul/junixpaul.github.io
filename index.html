<meta charset="utf-8">

<title>Junpaul Ian Taga-an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column (max 1080px), generous whitespace, hairline dividers, a single green accent used sparingly. */
:root{
  --bg:#F7F8F9; --surface:#FFFFFF; --fg:#1A1D21; --muted:#60666F; --line:#E3E6EA;
  --accent:#1E6E5A; --accent-soft:#E3F0EC;
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#181B1E; --fg:#E9EBEE; --muted:#9BA1A9; --line:#272B30;
  --accent:#6CC9AE; --accent-soft:#1A2E28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#181B1E; --fg:#E9EBEE; --muted:#9BA1A9; --line:#272B30;
  --accent:#6CC9AE; --accent-soft:#1A2E28; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
.in{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,5vw,48px)}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:4px}
a:hover{color:var(--accent);text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.label{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;justify-content:space-between;align-items:center;gap:16px;height:60px}
.bar .me{font-weight:600;text-decoration:none}
.bar ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:15px}
.bar ul a{text-decoration:none;color:var(--muted)}
.bar ul a:hover{color:var(--fg)}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);animation:grow linear both;animation-timeline:scroll(root)}
@keyframes grow{to{transform:scaleX(1)}}
@supports not (animation-timeline:scroll()){.progress{display:none}}
